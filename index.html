<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="theme-color" content="#0f1115" />
  <link rel="manifest" href="./manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>ЕГЭ-2027: Физика • Математика • Русский</title>
  <style>
    /* Design tokens & default Graphite theme */
    :root {
      --bg: #0f1115;
      --header-bg: rgba(15, 17, 21, 0.92);
      --surface: #181b21;
      --surface-alt: #21252e;
      --border: #2c313d;
      --text: #f0f2f5;
      --text-muted: #939aa6;
      --accent: #4f8ff7;
      --accent-soft: rgba(79, 143, 247, 0.15);
      --pattern-color: rgba(255, 255, 255, 0.045);
      --green: #22c55e;
      --green-soft: rgba(34, 197, 94, 0.15);
      --amber: #f59e0b;
      --amber-soft: rgba(245, 158, 11, 0.15);
      --red: #ef4444;
      --red-soft: rgba(239, 68, 68, 0.15);
      --purple: #a855f7;
      --purple-soft: rgba(168, 85, 247, 0.15);
      --radius: 18px;
      --radius-sm: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      background-color: var(--bg);
      color: var(--text);
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      width: 100%;
      max-width: 100%;
      min-height: 100dvh;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      transition: background-color 0.22s ease, color 0.22s ease;
    }

    body {
      padding-bottom: 104px;
    }

    /* Centered background patterns (grid removed) */
    body.pattern-none { background-image: none; }
    body.pattern-dots {
      background-image: radial-gradient(var(--pattern-color) 1.5px, transparent 1.5px);
      background-size: 18px 18px;
      background-position: center top;
      background-attachment: fixed;
    }
    body.pattern-diag {
      background-image: repeating-linear-gradient(
        -45deg,
        var(--pattern-color) 0,
        var(--pattern-color) 1px,
        transparent 1px,
        transparent 14px
      );
      background-position: center top;
      background-attachment: fixed;
    }

    .app-container {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      padding: 0 16px;
      overflow-x: hidden;
    }

    /* Sticky header */
    .top-header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--header-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 13px 16px 11px;
      margin: 0 -16px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .header-title {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .sync-badge {
      background: var(--surface-alt);
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 9px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }
    .sync-badge.ok { background: var(--green-soft); color: var(--green); border-color: rgba(34, 197, 94, 0.3); }
    .sync-badge.busy { background: var(--amber-soft); color: var(--amber); border-color: rgba(245, 158, 11, 0.3); }
    .sync-badge.err { background: var(--red-soft); color: var(--red); border-color: rgba(239, 68, 68, 0.3); }

    .pwa-btn {
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid rgba(79, 143, 247, 0.35);
      border-radius: 12px;
      padding: 7px 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .pwa-btn:active { transform: scale(0.96); }

    /* Cards & typography */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 14px;
      width: 100%;
    }

    .card-title {
      font-size: 17px;
      font-weight: 700;
      line-height: 1.35;
    }

    .card-sub {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .section-label {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    /* Buttons */
    .btn-primary {
      width: 100%;
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      display: block;
      transition: transform 0.14s ease, opacity 0.15s ease;
    }
    .btn-primary:active { transform: scale(0.98); }

    .btn-secondary {
      width: 100%;
      background: var(--surface-alt);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      display: block;
    }
    .btn-secondary:active { transform: scale(0.98); }

    .danger-btn {
      width: 100%;
      background: var(--red-soft);
      color: var(--red);
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-radius: var(--radius-sm);
      padding: 13px 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
    }
    .danger-btn:active { transform: scale(0.98); }

    .back-btn {
      background: var(--surface-alt);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 13px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .back-btn:active { transform: scale(0.96); }

    /* Animated 3-Step Onboarding Screen (in-flow inside #appRoot, never blocks pointer events when inactive) */
    .onboard-wrap {
      min-height: calc(100dvh - 84px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 12px 0;
    }
    .onboard-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 26px 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.38);
      position: relative;
      overflow: hidden;
    }
    .onboard-progress {
      display: flex;
      gap: 8px;
      margin-bottom: 22px;
    }
    .onboard-bar {
      height: 5px;
      flex: 1;
      border-radius: 99px;
      background: var(--surface-alt);
      transition: background-color 0.35s ease;
    }
    .onboard-bar.active { background: var(--accent); }

    @keyframes stepReveal {
      0% {
        opacity: 0;
        transform: translateY(20px) scale(0.97);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    .step-animate {
      animation: stepReveal 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .onboard-title {
      font-size: 23px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      line-height: 1.25;
    }
    .onboard-desc {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 18px;
      line-height: 1.5;
    }

    .google-oauth-btn {
      width: 100%;
      background: #ffffff;
      color: #111827;
      border: 1px solid #d1d5db;
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.16);
      transition: transform 0.14s ease;
    }
    .google-oauth-btn:active { transform: scale(0.98); }

    /* Subject graphic badges (inline SVG illustrations) */
    .subj-badge-img {
      width: 48px;
      height: 48px;
      border-radius: 13px;
      flex-shrink: 0;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .subj-badge-img svg, .subj-badge-sm svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .subj-badge-sm {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      flex-shrink: 0;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.16);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* Profile row */
    .profile-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .profile-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }
    .avatar {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 22px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .user-name {
      font-size: 18px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .streak-box {
      background: var(--amber-soft);
      border: 1px solid rgba(245, 158, 11, 0.28);
      border-radius: 14px;
      padding: 7px 11px;
      text-align: center;
      flex-shrink: 0;
    }
    .streak-val { font-size: 14px; font-weight: 800; color: var(--amber); line-height: 1.2; }
    .streak-lbl { font-size: 11px; color: var(--text-muted); }

    .settings-full-btn {
      width: 100%;
      margin-top: 12px;
      background: var(--surface-alt);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 11px 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .settings-full-btn:active { transform: scale(0.98); border-color: var(--accent); }

    /* Settings sub-tabs bar (4 tabs) */
    .settings-tabs {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }
    @media (min-width: 480px) {
      .settings-tabs {
        grid-template-columns: repeat(4, 1fr);
      }
    }
    .stab-btn {
      background: var(--surface);
      color: var(--text-muted);
      border: 1.5px solid var(--border);
      border-radius: 13px;
      padding: 10px 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      transition: all 0.16s ease;
    }
    .stab-btn.active {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: var(--accent);
    }

    /* Vertical Drag-Up Confirmation Mini-Test for Reset */
    .drag-reset-box {
      margin-top: 12px;
      background: var(--bg);
      border: 1.5px solid rgba(239, 68, 68, 0.45);
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      animation: stepReveal 0.3s ease forwards;
    }
    .drag-track {
      position: relative;
      width: 76px;
      height: 196px;
      margin: 14px auto 10px;
      background: var(--surface-alt);
      border: 2px dashed rgba(239, 68, 68, 0.45);
      border-radius: 38px;
      touch-action: none;
      user-select: none;
      overflow: hidden;
    }
    .drag-fill {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 0%;
      background: rgba(239, 68, 68, 0.25);
      pointer-events: none;
    }
    .drag-target-zone {
      position: absolute;
      top: 10px;
      left: 0;
      right: 0;
      font-size: 11px;
      font-weight: 800;
      color: var(--red);
      text-transform: uppercase;
      pointer-events: none;
    }
    .drag-knob {
      position: absolute;
      bottom: 6px;
      left: 6px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--red);
      color: #ffffff;
      font-size: 22px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      box-shadow: 0 6px 18px rgba(239, 68, 68, 0.45);
      touch-action: none;
    }
    .drag-knob:active { cursor: grabbing; }

    /* My Errors card */
    .mistake-card {
      border-color: rgba(239, 68, 68, 0.35);
      background: linear-gradient(180deg, var(--surface) 0%, rgba(239, 68, 68, 0.05) 100%);
    }
    .mistake-card.clean {
      border-color: rgba(34, 197, 94, 0.3);
      background: var(--surface);
    }
    .mistake-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--red-soft);
      color: var(--red);
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 99px;
      white-space: nowrap;
    }

    /* Score forecast & progress bars */
    .score-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 12px 0;
    }
    .score-pill {
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 8px;
      text-align: center;
    }
    .score-pill-val { font-size: 20px; font-weight: 800; color: var(--accent); line-height: 1.2; }
    .score-pill-lbl { font-size: 11px; color: var(--text-muted); margin-top: 3px; }

    .progress-track {
      width: 100%;
      height: 8px;
      background: var(--surface-alt);
      border-radius: 99px;
      overflow: hidden;
      margin-top: 6px;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 99px;
      transition: width 0.3s ease;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      margin-top: 10px;
    }

    /* Vertical selection list */
    .v-list { display: flex; flex-direction: column; gap: 10px; }

    .v-card-btn {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: transform 0.12s ease, border-color 0.15s ease;
    }
    .v-card-btn:active { transform: scale(0.985); border-color: var(--accent); }
    .v-card-left { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
    .v-card-arrow { font-size: 18px; color: var(--text-muted); flex-shrink: 0; }

    /* Difficulty badges */
    .lvl-badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 8px;
    }
    .lvl-1 { background: var(--green-soft); color: var(--green); }
    .lvl-2 { background: var(--accent-soft); color: var(--accent); }
    .lvl-3 { background: var(--purple-soft); color: var(--purple); }

    /* Inputs & problem UI */
    .text-input {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 13px 14px;
      font-size: 15px;
      font-family: inherit;
      outline: none;
    }
    .text-input:focus { border-color: var(--accent); }

    .input-row { display: flex; gap: 8px; margin-top: 14px; }
    .input-row .text-input { flex: 1; min-width: 0; }
    .input-row .btn-primary { width: auto; padding: 12px 20px; flex-shrink: 0; }

    .svg-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px;
      margin: 12px 0;
      display: flex;
      justify-content: center;
      overflow-x: auto;
    }

    /* Stress vowel selector */
    .stress-word-box {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 4px;
      margin: 18px 0;
      padding: 16px 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 16px;
    }
    .letter-btn {
      background: var(--surface-alt);
      color: var(--text);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      min-width: 34px;
      height: 44px;
      padding: 0 6px;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .letter-btn.consonant {
      background: transparent;
      border-color: transparent;
      color: var(--text-muted);
      cursor: default;
      min-width: 22px;
      padding: 0 2px;
    }
    .letter-btn.correct-letter { background: var(--green-soft); border-color: var(--green); color: var(--green); }
    .letter-btn.wrong-letter { background: var(--red-soft); border-color: var(--red); color: var(--red); }

    .choice-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 14px; }
    .choice-btn {
      background: var(--surface-alt);
      color: var(--text);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    /* SM-2 buttons */
    .sm2-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 12px; }
    .sm2-btn {
      border: none;
      border-radius: 12px;
      padding: 10px 4px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .sm2-btn span { font-size: 11px; font-weight: 500; opacity: 0.85; }
    .sm2-1 { background: var(--red-soft); color: var(--red); }
    .sm2-2 { background: var(--amber-soft); color: var(--amber); }
    .sm2-3 { background: var(--accent-soft); color: var(--accent); }
    .sm2-4 { background: var(--green-soft); color: var(--green); }

    .answer-panel {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-top: 14px;
      font-size: 15px;
      line-height: 1.55;
    }
    .feedback-banner { padding: 10px 14px; border-radius: 12px; font-size: 14px; font-weight: 700; margin-bottom: 10px; }
    .fb-ok { background: var(--green-soft); color: var(--green); }
    .fb-err { background: var(--red-soft); color: var(--red); }

    /* 3D flip cards in Theory */
    .flip-wrap { perspective: 1000px; margin-bottom: 12px; cursor: pointer; }
    .flip-inner {
      display: grid;
      transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
      transform-style: preserve-3d;
    }
    .flip-wrap.flipped .flip-inner { transform: rotateY(180deg); }
    .flip-face {
      grid-area: 1 / 1;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
    }
    .flip-back { transform: rotateY(180deg); background: var(--surface-alt); border-color: var(--accent); }

    .th-formula-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .th-rhs { color: var(--accent); transition: filter 0.2s ease; }
    .blur-rhs .th-rhs { filter: blur(7px); user-select: none; }

    /* Textbook-grade offline formula typography */
    .math {
      font-family: "Cambria Math", "STIX Two Text", "Times New Roman", Georgia, serif;
      font-size: 1.12rem;
      line-height: 1.65;
      letter-spacing: 0.02em;
      font-weight: 500;
    }
    .math sup, .math sub {
      font-size: 0.72em;
      line-height: 0;
    }
    .fbox {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 7px 12px;
      margin: 4px 0;
      max-width: 100%;
    }
    .frac {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      vertical-align: middle;
      margin: 0 4px;
      font-size: 0.92em;
      line-height: 1.22;
    }
    .frac > .num, .frac > span:first-child {
      border-bottom: 1.5px solid currentColor;
      padding: 0 4px 2px;
      text-align: center;
    }

      function loadScriptOnce(src) {
        return new Promise(function (resolve, reject) {
          var existing = document.querySelector('script[src="' + src + '"]');
          if (existing) {
            if (existing.getAttribute("data-loaded") === "1") return resolve();
            existing.addEventListener("load", function () { resolve(); });
            existing.addEventListener("error", function () { reject(new Error("Ошибка загрузки SDK")); });
            return;
          }
          var s = document.createElement("script");
          s.src = src;
          s.async = true;
          s.onload = function () { s.setAttribute("data-loaded", "1"); resolve(); };
          s.onerror = function () { reject(new Error("Не удалось загрузить Firebase SDK")); };
          document.head.appendChild(s);
        });
      }

      function parseFirebaseConfig(raw) {
        if (EMBEDDED_FIREBASE_CONFIG && EMBEDDED_FIREBASE_CONFIG.apiKey) return EMBEDDED_FIREBASE_CONFIG;
        var txt = (raw || "").trim();
        if (!txt) throw new Error("Вставь Firebase Config во вкладке «Аккаунт и бэкап» в Настройках");
        var firstBrace = txt.indexOf("{");
        var lastBrace = txt.lastIndexOf("}");
        if (firstBrace !== -1 && lastBrace > firstBrace) txt = txt.slice(firstBrace, lastBrace + 1);
        var jsonReady = txt.replace(/([{,]\s*)([a-zA-Z0-9_]+)\s*:/g, '$1"$2":').replace(/'/g, '"');
        var cfg = JSON.parse(jsonReady);
        if (!cfg.apiKey || !cfg.projectId) throw new Error("В конфиге должны быть apiKey и projectId");
        if (!cfg.databaseURL) cfg.databaseURL = "https://" + cfg.projectId + "-default-rtdb.firebaseio.com";
        return cfg;
      }

      function ensureFirebaseReady(rawCfg) {
        var cfg = parseFirebaseConfig(rawCfg);
        return loadScriptOnce("https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js")
          .then(function () {
            return Promise.all([
              loadScriptOnce("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"),
              loadScriptOnce("https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js")
            ]);
          })
          .then(function () {
            if (!window.firebase) throw new Error("Firebase SDK недоступен");
            if (!window.firebase.apps || !window.firebase.apps.length) {
              fbRuntime.app = window.firebase.initializeApp(cfg);
            } else {
              fbRuntime.app = window.firebase.app();
            }
            fbRuntime.auth = window.firebase.auth();
            fbRuntime.db = window.firebase.database();
            fbRuntime.sdkLoaded = true;
            return fbRuntime;

      }

                return rt.auth.signInWithRedirect(provider);
              }
              throw popupErr;
            });
          })
          .then(function (res) {
            var user = res && res.user;
            if (!user) return;
            cloudCfg.mode = "firebase";
            if (rawCfg) cloudCfg.fbConfigRaw = rawCfg;
            cloudCfg.fbUserEmail = user.email || "Google-аккаунт";
            cloudCfg.fbUserUid = user.uid;

      function pullCloudState(forcePushIfNewerLocal) {
        if (cloudCfg.mode !== "firebase" || !cloudCfg.fbUserUid) {
          setSyncBadge("", "Гость");
          return;
        }
        setSyncBadge("busy", "⏳ Google...");

          .then(function (rt) {
            var currentUser = rt.auth.currentUser;
            var uid = (currentUser && currentUser.uid) || cloudCfg.fbUserUid;
            return rt.db.ref("users/" + uid + "/ege2027").once("value");
          })
          .then(function (snap) {
            var val = snap && snap.val();
            if (val) {
              var updated = applyMergedRemoteState(val);
              if (!updated && forcePushIfNewerLocal) { pushCloudState(); return; }
            } else if (forcePushIfNewerLocal) {
              pushCloudState();
              return;
            }
            setSyncBadge("ok", "☁️ Google");

      function encodeBackupCode() {
        var copy = JSON.parse(JSON.stringify(state));
        if (copy.avatarPhoto && copy.avatarPhoto.length > 30000) copy.avatarPhoto = "";
        return "EGE27:" + btoa(unescape(encodeURIComponent(JSON.stringify(copy))));
      }

      function decodeAndRestoreBackup(rawCode) {
        var cleaned = (rawCode || "").trim();
        if (!cleaned) throw new Error("Вставь код прогресса в поле выше");
        if (cleaned.indexOf("EGE27:") === 0) cleaned = cleaned.slice(6);
        var parsed = JSON.parse(decodeURIComponent(escape(atob(cleaned))));
        if (!parsed || typeof parsed !== "object" || !parsed.srs) {
          throw new Error("Неверный формат кода резервной копии");
        }
        var merged = Object.assign({}, JSON.parse(JSON.stringify(defaultState)), parsed);
        merged.onboardingCompleted = true;
        if (merged.pattern === "grid") merged.pattern = "none";
        state = ensureSRS(merged);
        saveState();
        applyAppearance(state.theme, state.pattern);
      }

      function copyTextToClipboard(text, onDone) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () { onDone(true); }).catch(function () { fallbackCopy(text, onDone); });
        } else {
          fallbackCopy(text, onDone);
        }
      }

      function fallbackCopy(text, onDone) {
        try {
          var ta = document.createElement("textarea");
          ta.value = text;
          ta.style.position = "fixed";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          var ok = document.execCommand("copy");
          document.body.removeChild(ta);
          onDone(Boolean(ok));
        } catch (e) {
          onDone(false);
        }
      }

      function checkStreakOnLoad() {
        if (!state.lastActiveISO) return;
        var today = toISO(new Date());
        var yesterday = toISO(new Date(Date.now() - DAY_MS));

      function recordAnswer(cardId, quality) {
        var st = state.srs[cardId];
        if (!st) {
          st = { rep: 0, interval: 0, ef: 2.5, nextReview: 0, attempts: 0, correct: 0 };
          state.srs[cardId] = st;
        }
        st.attempts = (st.attempts || 0) + 1;
        if (quality >= 3) {
          st.correct = (st.correct || 0) + 1;
          registerSuccessForMistake(cardId);
        } else if (quality === 1) {
          registerMistake(cardId);
        }

        if (quality === 1) {
          st.rep = 0;
          st.interval = 0;
          st.nextReview = Date.now() + 60 * 1000;
        } else {
          if (st.rep === 0) st.interval = quality === 2 ? 0.5 : quality === 3 ? 1 : 4;
          else if (st.rep === 1) st.interval = quality === 2 ? 1 : quality === 3 ? 3 : 6;
          else {
            var mult = quality === 2 ? 1.2 : quality === 3 ? st.ef : st.ef * 1.3;
            st.interval = Math.max(1, Math.round(st.interval * mult));
          }
          st.rep += 1;
          st.ef = Math.max(1.3, st.ef + (quality === 2 ? -0.15 : quality === 4 ? 0.15 : 0));
          st.nextReview = Date.now() + st.interval * DAY_MS;
        }

        var today = toISO(new Date());
        var yesterday = toISO(new Date(Date.now() - DAY_MS));
        if (state.lastActiveISO !== today) {
          state.streak = state.lastActiveISO === yesterday ? state.streak + 1 : 1;
          state.lastActiveISO = today;
        }
        state.history[today] = (state.history[today] || 0) + 1;
        var cardObj = CARDS.find(function (c) { return c.id === cardId; });
        if (cardObj) {
          if (!Array.isArray(state.historyDetails[today])) state.historyDetails[today] = [];
          state.historyDetails[today].push({
            id: cardObj.id,
            subject: cardObj.subject,
            topic: cardObj.topic,
            title: cardObj.title,
            ok: quality >= 3
          });
        }
        saveState();
      }

      function calcSubjectPrediction(sub, baseScore) {
        var list = CARDS.filter(function (c) { return c.subject === sub; });
        if (!list.length) return baseScore;
        var mastered = 0;
        list.forEach(function (c) {
          var s = state.srs[c.id];
          if (s && s.rep >= 1) mastered += 1;
        });
        var ratio = mastered / list.length;
        var gain = Math.round((100 - baseScore) * ratio * 0.85);
        return Math.min(100, baseScore + gain);
      }

      function getStats() {
        var totalAnswered = 0;
        var totalCorrect = 0;
        var levels = [
          { lvl: 1, name: "1. Лёгкий (устный)", total: 0, mastered: 0 },
          { lvl: 2, name: "2. Средний (задачи)", total: 0, mastered: 0 },
          { lvl: 3, name: "3. Сложный (№26 / №18 / №8)", total: 0, mastered: 0 }
        ];

        CARDS.forEach(function (c) {
          var s = state.srs[c.id] || {};
          totalAnswered += s.attempts || 0;
          totalCorrect += s.correct || 0;
          var idx = c.level - 1;
          if (levels[idx]) {
            levels[idx].total += 1;
            if ((s.rep || 0) >= 1) levels[idx].mastered += 1;
          }
        });

        var accuracy = totalAnswered > 0 ? Math.round((totalCorrect / totalAnswered) * 100) : 0;
        var pPhys = calcSubjectPrediction("physics", state.basePhys);
        var pMath = calcSubjectPrediction("math", state.baseMath);
        var pRus = calcSubjectPrediction("russian", state.baseRus);

        return {
          totalAnswered: totalAnswered,
          accuracy: accuracy,
          levels: levels,
          pPhys: pPhys,
          pMath: pMath,
          pRus: pRus,
          sumPredicted: pPhys + pMath + pRus
        };
      }

          var tmp = list[i]; list[i] = list[j]; list[j] = tmp;
        }
        trMistakeMode = true;
        trQueue = list;
        trIdx = 0;
        trProblemInst = null;
        trStressAnswered = false;
        trChoiceAnswered = false;
        trCurrentFailed = false;
        trStep = 3;
        switchTab("trainer");
      }

      function buildQueue(sub, lvl) {
        var now = Date.now();
        var filtered = CARDS.filter(function (c) {
          if (sub !== "all" && c.subject !== sub) return false;
          if (lvl !== 0 && c.level !== lvl) return false;
          return true;
        });
        var due = filtered.filter(function (c) { return (state.srs[c.id].nextReview || 0) <= now; });
        var pool = due.length > 0 ? due : filtered;
        var copy = pool.slice();
        for (var i = copy.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var tmp = copy[i]; copy[i] = copy[j]; copy[j] = tmp;
        }
        return copy;
      }

      // =====================================================================
      function parseISODate(iso) {
        var p = iso.split("-").map(Number);
        return new Date(p[0], p[1] - 1, p[2]);
      }

      function getMondayOfWeek(dateObj) {
        var d = new Date(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate());
        var day = d.getDay();
        var diff = day === 0 ? -6 : (1 - day);
        d.setDate(d.getDate() + diff);
        return d;
      }

      function renderCalendarView(root) {
        var todayISO = toISO(new Date());
        var subLabels = { physics: "Физика", math: "Профильная математика", russian: "Русский язык" };
        var dowShort = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];

        // Only include cards that were actually started (nextReview > 0) so untouched cards don't clutter today
        var dueByDate = {};
        CARDS.forEach(function (c) {
          var st = state.srs[c.id];
          if (!st || !st.nextReview || st.nextReview <= 0) return;
          var dISO = st.nextReview <= Date.now() ? todayISO : toISO(new Date(st.nextReview));
          if (!dueByDate[dISO]) dueByDate[dISO] = [];
          dueByDate[dISO].push(c);
        });

        var modeSwitchHtml =
          '<div class="cal-mode-switch">' +
            '<button id="btnCalMonth" class="cal-mode-btn' + (calMode === "month" ? " active" : "") + '" type="button">📅 Месяц</button>' +
            '<button id="btnCalWeek" class="cal-mode-btn' + (calMode === "week" ? " active" : "") + '" type="button">🗓️ Неделя</button>' +
          '</div>';

        var topCardHtml = "";
        var detailCardHtml = "";

        if (calMode === "month") {
          var firstDay = new Date(calYear, calMonth, 1);
          var monthTitle = firstDay.toLocaleDateString("ru-RU", { month: "long", year: "numeric" });
          monthTitle = monthTitle.charAt(0).toUpperCase() + monthTitle.slice(1);

          var dow = firstDay.getDay();
          var offset = dow === 0 ? 6 : dow - 1;
          var daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();

          var cells = "";
          for (var i = 0; i < offset; i++) cells += '<div class="cal-cell empty"></div>';
          for (var day = 1; day <= daysInMonth; day++) {
            var iso = toISO(new Date(calYear, calMonth, day));
            var hasAct = (state.history[iso] || 0) > 0;
            var hasDue = (dueByDate[iso] || []).length > 0;
            var cls = "cal-cell" + (iso === todayISO ? " today" : "") + (iso === calSelectedISO ? " selected" : "");
            cells +=
              '<button class="' + cls + '" data-cdate="' + iso + '" type="button">' +
                '<span>' + day + '</span>' +
                '<div class="cal-dots">' +
                  (hasAct ? '<span class="dot-active"></span>' : '') +
                  (hasDue ? '<span class="dot-due"></span>' : '') +
                '</div>' +
              '</button>';
          }

          topCardHtml =
            '<div class="card">' +
              modeSwitchHtml +
              '<div class="cal-header">' +
                '<button id="btnPrevCal" class="back-btn" type="button">‹</button>' +
                '<div class="card-title">' + escapeHtml(monthTitle) + '</div>' +
                '<button id="btnNextCal" class="back-btn" type="button">›</button>' +
              '</div>' +

      function compressImage(file, cb) {
        var reader = new FileReader();
        reader.onload = function (ev) {
          var img = new Image();
          img.onload = function () {
            var size = 160, canvas = document.createElement("canvas");
            canvas.width = size; canvas.height = size;
            var ctx = canvas.getContext("2d"), side = Math.min(img.width, img.height);
            ctx.drawImage(img, Math.floor((img.width - side) / 2), Math.floor((img.height - side) / 2), side, side, 0, 0, size, size);
            try { cb(canvas.toDataURL("image/jpeg", 0.82)); } catch (e) { cb(""); }
          };
          img.onerror = function () { cb(""); };
          img.src = ev.target.result;
        };
        reader.onerror = function () { cb(""); };
        reader.readAsDataURL(file);
      }

      function bindDragResetSlider(onConfirm) {
        var track = document.getElementById("dragResetTrack");
        var knob = document.getElementById("dragResetKnob");
        var fill = document.getElementById("dragResetFill");
        if (!track || !knob || !fill) return;
        var dragging = false, maxLift = 124, currentLift = 0;

        function updatePos(clientY) {
          var rect = track.getBoundingClientRect();
          var lift = rect.bottom - clientY - 36;
          currentLift = Math.max(0, Math.min(maxLift, lift));
          knob.style.bottom = (6 + currentLift) + "px";
          fill.style.height = Math.round((currentLift / maxLift) * 100) + "%";
          if (currentLift >= maxLift - 6) {
            dragging = false;
            onConfirm();
          }
        }

        knob.addEventListener("pointerdown", function (e) {
          dragging = true;
          knob.setPointerCapture(e.pointerId);
          updatePos(e.clientY);
        });
        knob.addEventListener("pointermove", function (e) { if (dragging) updatePos(e.clientY); });
        knob.addEventListener("pointerup", function () {
          if (!dragging) return;
          dragging = false;
          currentLift = 0;
          knob.style.bottom = "6px";
          fill.style.height = "0%";
        });
      }

              saveState();
              var msg = document.getElementById("profileStatusMsg");
              if (msg) { msg.textContent = "Профиль сохранён!"; msg.className = "status-msg show fb-ok"; }
            });
          }
        } else if (settingsTab === "appearance") {
          root.querySelectorAll("[data-tid]").forEach(function (btn) {
            btn.addEventListener("click", function () {
              draftTheme = btn.getAttribute("data-tid");
              state.theme = draftTheme;
              saveState();
              applyAppearance(state.theme, state.pattern);
              renderApp();
            });
          });
          root.querySelectorAll("[data-pid]").forEach(function (btn) {
            btn.addEventListener("click", function () {
              draftPattern = btn.getAttribute("data-pid");
              state.pattern = draftPattern;
              saveState();
              applyAppearance(state.theme, state.pattern);
              renderApp();
            });
          });
        } else if (settingsTab === "mocks") {
          function bindS(rid, lid, fn) {
            var r = document.getElementById(rid), l = document.getElementById(lid);
            if (r && l) r.addEventListener("input", function () { var v = parseInt(r.value, 10) || 0; l.textContent = v; fn(v); });
          }
          bindS("rngPhys", "lblPhys", function (v) { draftPhys = v; });
          bindS("rngMath", "lblMath", function (v) { draftMath = v; });
          bindS("rngRus", "lblRus", function (v) { draftRus = v; });
          bindS("rngGoal", "lblGoal", function (v) { draftGoal = v; });
          var saveM = document.getElementById("btnSaveMocks");
          if (saveM) {
            saveM.addEventListener("click", function () {
              state.basePhys = draftPhys; state.baseMath = draftMath; state.baseRus = draftRus; state.goalSum = draftGoal;
              saveState();
              var msg = document.getElementById("mocksStatusMsg");
              if (msg) { msg.textContent = "Баллы пробников сохранены!"; msg.className = "status-msg show fb-ok"; }
            });
          }
        } else {
          var txtFb = document.getElementById("txtFbConfig");
          if (txtFb) txtFb.addEventListener("input", function (e) { draftFbConfig = e.target.value; });
          var gIn = document.getElementById("btnGoogleSignIn");
          if (gIn) {
            gIn.addEventListener("click", function () {
              var msg = document.getElementById("cloudStatusMsg");
              signInWithGoogleFirebase(draftFbConfig, function (err, user) {
                if (err) {
                  if (msg) { msg.textContent = err.message; msg.className = "status-msg show fb-err"; }
                  return;
                }
                if (msg) { msg.textContent = "Вошли как: " + (user.email || "Google"); msg.className = "status-msg show fb-ok"; }
                setTimeout(function () { renderApp(); }, 400);
              });
            });
          }
          var gOut = document.getElementById("btnGoogleSignOut");
          if (gOut) gOut.addEventListener("click", function () { signOutGoogleFirebase(function () { renderApp(); }); });

          var copyBtn = document.getElementById("btnCopyBackup");
          if (copyBtn) {
            copyBtn.addEventListener("click", function () {
              var code = encodeBackupCode();
              var ta = document.getElementById("txtBackupCode"), msg = document.getElementById("backupStatusMsg");
              if (ta) ta.value = code;
              copyTextToClipboard(code, function (ok) {
                if (msg) { msg.textContent = ok ? "Код прогресса скопирован!" : "Код в поле выше — скопируй вручную."; msg.className = "status-msg show fb-ok"; }
              });
            });
          }
          var resBtn = document.getElementById("btnRestoreBackup");
          if (resBtn) {
            resBtn.addEventListener("click", function () {
              var ta = document.getElementById("txtBackupCode"), msg = document.getElementById("backupStatusMsg");
              try {
                decodeAndRestoreBackup(ta ? ta.value : "");
                if (msg) { msg.textContent = "Прогресс восстановлен!"; msg.className = "status-msg show fb-ok"; }
                setTimeout(function () { switchTab("home"); }, 600);
              } catch (e) {
                if (msg) { msg.textContent = e.message; msg.className = "status-msg show fb-err"; }
              }
            });
          }
          var openReset = document.getElementById("btnOpenResetTest");
          if (openReset) openReset.addEventListener("click", function () { resetConfirmOpen = true; renderApp(); });
          var cancelReset = document.getElementById("btnCancelResetTest");
          if (cancelReset) cancelReset.addEventListener("click", function () { resetConfirmOpen = false; renderApp(); });
          if (resetConfirmOpen) {
            bindDragResetSlider(function () {
              try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
              state = ensureSRS(JSON.parse(JSON.stringify(defaultState)));
              applyAppearance(state.theme, state.pattern);
              resetConfirmOpen = false;
              startOnboarding();
            });
          }
        }
      }

      // =====================================================================
      // TAB 3: THEORY (PHYSICS ONLY: SUBJECT -> SECTION TABS -> 3D CARDS)
      // =====================================================================
      function renderTheoryView(root) {
        if (thStep === 1) {
          var cPhys = THEORY_CARDS.filter(function (c) { return c.subject === "physics"; }).length;

          root.innerHTML =
            '<div class="section-label">Шаг 1. Выберите предмет</div>' +
            '<div class="v-list">' +
              '<button class="v-card-btn" data-thsub="physics" type="button">' +
                '<div class="v-card-left">' + getSubjectBadgeHtml("physics", false) +
                  '<div><div class="card-title">Физика</div><div class="card-sub">4 раздела: Механика, МКТ, Электродинамика, Оптика и кванты • ' + cPhys + ' конспектов</div></div>' +
                '</div><span class="v-card-arrow">→</span>' +
              '</button>' +
            '</div>';

          root.querySelectorAll("[data-thsub]").forEach(function (btn) {
            btn.addEventListener("click", function () {
              thSubject = btn.getAttribute("data-thsub");
              thStep = 2;
              renderApp();
            });
          });
          return;
        }

        if (thStep === 2) {
          var subjectCardsAll = THEORY_CARDS.filter(function (c) { return c.subject === thSubject; });
          var starCount = subjectCardsAll.filter(function (c) { return state.starredTheory.indexOf(c.id) !== -1; }).length;

          var topicsHtml = (THEORY_TOPICS[thSubject] || []).map(function (t) {
            var cnt = subjectCardsAll.filter(function (c) { return c.topic === t.id; }).length;
            return '<button class="v-card-btn" data-thtop="' + t.id + '" type="button">' +
              '<div>' +
                '<div class="card-title">' + escapeHtml(t.name) + '</div>' +
                '<div class="card-sub">' + escapeHtml(t.desc) + ' • ' + cnt + ' карт.</div>' +
              '</div>' +
              '<span class="v-card-arrow">→</span>' +
            '</button>';
          }).join("");

          root.innerHTML =
            '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">' +
              '<button id="btnThBack1" class="back-btn" type="button">← Назад</button>' +
              '<div style="display:flex; align-items:center; gap:8px;">' +
                getSubjectBadgeHtml("physics", true) +
                '<span style="font-size:14px; font-weight:700; color:var(--text);">Физика</span>' +
              '</div>' +
            '</div>' +
            '<div class="section-label">Разделы физики</div>' +
            '<div class="v-list">' +
              topicsHtml +
              '<button class="v-card-btn" data-thtop="all" type="button">' +
                '<div><div class="card-title">Все разделы физики</div><div class="card-sub">Полный конспект кодификатора • ' + subjectCardsAll.length + ' карт.</div></div>' +
                '<span class="v-card-arrow">→</span>' +
              '</button>' +
              '<button class="v-card-btn" data-thtop="starred" type="button" style="border-color:rgba(245,158,11,0.35);">' +
                '<div><div class="card-title">★ Избранное</div><div class="card-sub">Сохранённые конспекты • ' + starCount + ' карт.</div></div>' +
                '<span class="v-card-arrow">→</span>' +
              '</button>' +
            '</div>';

          var thBack1 = document.getElementById("btnThBack1");
          if (thBack1) thBack1.addEventListener("click", function () { thStep = 1; renderApp(); });

          root.querySelectorAll("[data-thtop]").forEach(function (btn) {
            btn.addEventListener("click", function () {
              thTopic = btn.getAttribute("data-thtop");
              thSearch = "";
              thFlipped = {};
              thStep = 3;
              renderApp();
            });
          });
          return;
        }

        var topicTitle = "Все разделы физики";
        if (thTopic === "starred") {
          topicTitle = "★ Избранное";
        } else if (thTopic !== "all") {
          var foundTopic = (THEORY_TOPICS[thSubject] || []).find(function (t) { return t.id === thTopic; });
          if (foundTopic) topicTitle = foundTopic.name;
        }

        var subjectCards = THEORY_CARDS.filter(function (c) { return c.subject === thSubject; });

        // Section tabs bar inside Physics theory for instant switching
        var sectionTabsHtml =
          '<div class="th-pills">' +
            (THEORY_TOPICS[thSubject] || []).map(function (t) {
              return '<button class="th-pill' + (thTopic === t.id ? ' active' : '') + '" data-thpill="' + t.id + '" type="button">' + escapeHtml(t.name) + '</button>';
            }).join("") +
            '<button class="th-pill' + (thTopic === "all" ? ' active' : '') + '" data-thpill="all" type="button">Все</button>' +
            '<button class="th-pill' + (thTopic === "starred" ? ' active' : '') + '" data-thpill="starred" type="button">★ Избранное</button>' +
          '</div>';

        var cards = subjectCards.filter(function (c) {
          if (thTopic === "starred") {
            if (state.starredTheory.indexOf(c.id) === -1) return false;
          } else if (thTopic !== "all" && c.topic !== thTopic) {
            return false;
          }
          if (thSearch.trim()) {
            var q = thSearch.trim().toLowerCase();
            var plainExplain = c.explain.replace(/<[^>]+>/g, " ");
            return (c.name + " " + c.sub + " " + c.unit + " " + plainExplain).toLowerCase().indexOf(q) !== -1;
          }
          return true;
        });

        var cardsHtml = cards.length === 0
          ? '<div class="card" style="text-align:center; color:var(--text-muted); padding:24px 16px;">' +
              (thTopic === "starred" ? "Нажми звёздочку ☆ на любой карточке, чтобы добавить её в избранное" : "По запросу ничего не найдено") +
            '</div>'
          : cards.map(function (c) {
              var isStar = state.starredTheory.indexOf(c.id) !== -1;
              var isFlip = Boolean(thFlipped[c.id]);
              return '<div class="flip-wrap' + (isFlip ? ' flipped' : '') + '" data-flipid="' + c.id + '">' +
                '<div class="flip-inner">' +
                  '<div class="flip-face">' +
                    '<div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">' +
                      '<div>' +
                        '<div class="card-title">' + escapeHtml(c.name) + '</div>' +
                        '<div class="card-sub">' + escapeHtml(c.sub) + '</div>' +
                      '</div>' +
                      '<button class="star-btn' + (isStar ? ' starred' : '') + '" data-starid="' + c.id + '" type="button">' + (isStar ? '★' : '☆') + '</button>' +
                    '</div>' +
                    '<div class="th-formula-box">' +
                      '<span>' + c.lhs + '</span>' +
                      '<span style="color:var(--text-muted);">→</span>' +
                      '<span class="th-rhs">' + c.rhs + '</span>' +
                    '</div>' +
                    '<div style="display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;">' +
                      '<span class="card-sub">' + escapeHtml(c.unit) + '</span>' +
                      '<span style="font-size:12px; font-weight:700; color:var(--accent);">Нажми для разбора ↻</span>' +
                    '</div>' +
                  '</div>' +
                  '<div class="flip-face flip-back">' +
                    '<div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">' +
                      '<div class="card-title" style="color:var(--accent);">' + escapeHtml(c.name) + '</div>' +
                      '<span style="font-size:12px; color:var(--text-muted); flex-shrink:0;">↻ Назад</span>' +
                    '</div>' +
                    '<div class="th-back-body">' + c.explain + '</div>' +
                    (c.svg ? '<div class="svg-box" style="margin:6px 0 0;">' + c.svg + '</div>' : '') +
                  '</div>' +
                '</div>' +
              '</div>';
            }).join("");

        root.innerHTML =
          '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">' +
            '<button id="btnThBack2" class="back-btn" type="button">← Разделы</button>' +
            '<div style="display:flex; align-items:center; gap:8px;">' +
              getSubjectBadgeHtml("physics", true) +
              '<span style="font-size:14px; font-weight:700; color:var(--text);">' + escapeHtml(topicTitle) + '</span>' +
            '</div>' +
          '</div>' +
          sectionTabsHtml +
          '<div class="input-row" style="margin-top:0; margin-bottom:12px;">' +
            '<input id="inpThSearch" class="text-input" type="search" value="' + escapeHtml(thSearch) + '" placeholder="Поиск формулы или правила..." />' +
            '<button id="btnThHide" class="btn-secondary" style="width:auto; padding:12px 14px;" type="button">' + (thHideRhs ? 'Открыть' : 'Скрыть') + '</button>' +
          '</div>' +
          '<div class="' + (thHideRhs ? 'blur-rhs' : '') + '">' + cardsHtml + '</div>';

        var thBack2 = document.getElementById("btnThBack2");
        if (thBack2) thBack2.addEventListener("click", function () { thStep = 2; renderApp(); });

        root.querySelectorAll("[data-thpill]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            thTopic = btn.getAttribute("data-thpill");
            thFlipped = {};
            renderApp();
          });
        });

        var sInp = document.getElementById("inpThSearch");
        if (sInp) {
          sInp.addEventListener("input", function (e) {
            thSearch = e.target.value;
            var pos = sInp.selectionStart;
            renderApp();
            var nextInp = document.getElementById("inpThSearch");
            if (nextInp) { nextInp.focus(); nextInp.setSelectionRange(pos, pos); }
          });
        }

        var hideBtn = document.getElementById("btnThHide");
        if (hideBtn) hideBtn.addEventListener("click", function () { thHideRhs = !thHideRhs; renderApp(); });

        root.querySelectorAll("[data-starid]").forEach(function (btn) {
          btn.addEventListener("click", function (e) {
            e.stopPropagation();
            var id = btn.getAttribute("data-starid");
            var idx = state.starredTheory.indexOf(id);
            if (idx === -1) state.starredTheory.push(id);
            else state.starredTheory.splice(idx, 1);
            saveState();
            renderApp();
          });
        });

        root.querySelectorAll("[data-flipid]").forEach(function (el) {
          el.addEventListener("click", function () {
            var id = el.getAttribute("data-flipid");
            thFlipped[id] = !thFlipped[id];
            el.classList.toggle("flipped", Boolean(thFlipped[id]));
          });
        });
      }

      // =====================================================================
      // 7. INITIALIZATION & CLEAN HTML EXPORT
      // =====================================================================
      function initApp() {
        requestPersistentStorage();
        checkStreakOnLoad();
        applyAppearance(state.theme, state.pattern);

        document.addEventListener("visibilitychange", function () {
          if (document.visibilityState === "visible" && cloudCfg.mode === "firebase") {
            pullCloudState(false);
          }
        });

        document.querySelectorAll(".nav-btn").forEach(function (btn) {
          btn.addEventListener("click", function () { switchTab(btn.getAttribute("data-tab")); });
        });

        var openSettingsHeaderBtn = document.getElementById("openSettingsHeaderBtn");
        if (openSettingsHeaderBtn) {
          openSettingsHeaderBtn.addEventListener("click", function () { switchTab("settings"); });
        }

        var pwaModal = document.getElementById("pwaModal");
        var openPwaBtn = document.getElementById("openPwaModalBtn");
        var closePwaBtn = document.getElementById("closePwaModalBtn");
        var downloadHtmlBtn = document.getElementById("downloadCleanHtmlBtn");

        if (pwaModal) pwaModal.classList.remove("open");
        if (openPwaBtn && pwaModal) openPwaBtn.addEventListener("click", function () { pwaModal.classList.add("open"); });
        if (closePwaBtn && pwaModal) closePwaBtn.addEventListener("click", function () { pwaModal.classList.remove("open"); });
        if (pwaModal) pwaModal.addEventListener("click", function (e) { if (e.target === pwaModal) pwaModal.classList.remove("open"); });

        if (downloadHtmlBtn) {
          downloadHtmlBtn.addEventListener("click", function () {
            var clone = document.documentElement.cloneNode(true);
            var rootEl = clone.querySelector("#appRoot");
            if (rootEl) rootEl.innerHTML = "";
            var modalEl = clone.querySelector("#pwaModal");
            if (modalEl) modalEl.classList.remove("open");
            var htmlStr = "<!DOCTYPE html>\n" + clone.outerHTML;
            var blob = new Blob([htmlStr], { type: "text/html;charset=utf-8" });
            var url = URL.createObjectURL(blob);
            var a = document.createElement("a");
            a.href = url;
            a.download = "index.html";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
          });
        }

        if (!state.onboardingCompleted) {
          startOnboarding();
        } else {
          isOnboardingActive = false;
          switchTab("home");
          if (cloudCfg.mode === "firebase") pullCloudState(true);
        }
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", initApp);
      } else {
        initApp();
      }
    })();
  </script>
</body>
</html>
